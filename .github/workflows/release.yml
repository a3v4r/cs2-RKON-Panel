name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone panel
        run: npm run package

      - name: Zip
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path .next/standalone/* -DestinationPath "cs2-rcon-panel-web-$version.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: cs2-rcon-panel-web-*.zip
