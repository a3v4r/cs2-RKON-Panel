name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone panel
        run: npm run package

      # Ready to run on a clean Windows PC: node.exe of this build, the panel in app\, start.bat and firewall.bat
      - name: Zip
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item .next/standalone dist/app -Recurse
          Copy-Item launcher/* dist -Recurse
          Copy-Item (Get-Command node).Source dist/node.exe
          Compress-Archive -Path dist/* -DestinationPath "matchdesk-$version.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: matchdesk-*.zip
